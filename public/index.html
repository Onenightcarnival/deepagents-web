<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepAgent Web</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
    --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922; --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
  }
  /* ---------- sidebar ---------- */
  #sidebar {
    width: 260px; min-width: 260px; background: var(--bg2);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  #sidebar header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  #sidebar header h1 { font-size: 15px; font-weight: 600; }
  #sessions { flex: 1; overflow-y: auto; padding: 8px; }
  .session-item {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px;
    color: var(--text-dim); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; display: flex; align-items: center; gap: 6px;
  }
  .session-item:hover { background: var(--bg3); }
  .session-item.active { background: var(--bg3); color: var(--text); }
  .session-item .del {
    margin-left: auto; opacity: 0; font-size: 12px; padding: 0 4px;
  }
  .session-item:hover .del { opacity: 0.6; }
  .session-item .del:hover { opacity: 1; color: var(--red); }
  #sidebar footer { border-top: 1px solid var(--border); padding: 10px 12px; }
  #sidebar footer .row { margin-bottom: 8px; }
  #sidebar footer label { color: var(--text-dim); font-size: 12px; display: block; margin-bottom: 3px; }
  select, input[type=text], textarea {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 8px; width: 100%; font-size: 13px;
    font-family: inherit;
  }
  button {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--text-dim); }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.primary:hover { background: #388bfd; }
  button.danger { color: var(--red); }
  button.small { padding: 3px 8px; font-size: 12px; }
  /* ---------- main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    padding: 10px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  #topbar .title { font-weight: 600; }
  #topbar .cwd { color: var(--text-dim); font-size: 12px; font-family: monospace; }
  #topbar .model {
    margin-left: auto; color: var(--text-dim); font-size: 12px;
    background: var(--bg3); padding: 3px 10px; border-radius: 10px;
  }
  #chat { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
  #chat-inner { max-width: 860px; margin: 0 auto; }
  .msg { margin-bottom: 16px; }
  .msg.user .bubble {
    background: #1f6feb22; border: 1px solid #1f6feb55; border-radius: 10px;
    padding: 10px 14px; margin-left: 15%; white-space: pre-wrap;
  }
  .msg.assistant .content { line-height: 1.65; }
  .msg .reasoning {
    color: var(--text-dim); font-size: 13px; border-left: 3px solid var(--purple);
    padding: 4px 10px; margin: 6px 0; white-space: pre-wrap;
  }
  .msg .content pre {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0; font-size: 13px;
  }
  .msg .content code { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .msg .content p code, .msg .content li code {
    background: var(--bg3); padding: 1px 5px; border-radius: 4px; font-size: 13px;
  }
  .tool-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    margin: 8px 0; overflow: hidden; font-size: 13px;
  }
  .tool-card .tool-head {
    padding: 7px 12px; display: flex; gap: 8px; align-items: center;
    cursor: pointer; user-select: none;
  }
  .tool-card .tool-name { color: var(--accent); font-family: monospace; font-weight: 600; }
  .tool-card .tool-arg {
    color: var(--text-dim); font-family: monospace; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; flex: 1;
  }
  .tool-card .tool-status { font-size: 12px; }
  .tool-card .tool-body {
    border-top: 1px solid var(--border); padding: 8px 12px; display: none;
  }
  .tool-card.open .tool-body { display: block; }
  .tool-card .tool-body pre {
    white-space: pre-wrap; word-break: break-all; font-size: 12px;
    font-family: ui-monospace, monospace; max-height: 300px; overflow-y: auto;
  }
  .tool-body .label { color: var(--text-dim); font-size: 11px; margin: 6px 0 2px; }
  /* approval */
  .approval {
    background: #d2992211; border: 1px solid var(--yellow); border-radius: 10px;
    padding: 14px; margin: 12px 0;
  }
  .approval h4 { color: var(--yellow); margin-bottom: 8px; font-size: 14px; }
  .approval pre {
    background: var(--bg2); border-radius: 6px; padding: 8px 10px; margin: 8px 0;
    white-space: pre-wrap; word-break: break-all; font-size: 13px;
    font-family: ui-monospace, monospace; max-height: 200px; overflow-y: auto;
  }
  .approval .buttons { display: flex; gap: 8px; margin-top: 10px; }
  /* todos */
  #todos {
    border-top: 1px solid var(--border); padding: 8px 20px; font-size: 12px;
    color: var(--text-dim); display: none; max-height: 120px; overflow-y: auto;
  }
  #todos.visible { display: block; }
  #todos .todo { display: flex; gap: 6px; padding: 2px 0; }
  #todos .todo.completed { text-decoration: line-through; opacity: 0.5; }
  #todos .todo.in_progress { color: var(--accent); }
  /* composer */
  #composer { border-top: 1px solid var(--border); padding: 14px 20px; }
  #composer-inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  #input { flex: 1; resize: none; min-height: 44px; max-height: 200px; line-height: 1.5; }
  #status-line {
    max-width: 860px; margin: 6px auto 0; font-size: 12px; color: var(--text-dim);
    display: flex; gap: 10px; align-items: center;
  }
  .spinner {
    width: 12px; height: 12px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* modal */
  #modal-backdrop {
    position: fixed; inset: 0; background: #000a; display: none;
    align-items: center; justify-content: center; z-index: 10;
  }
  #modal-backdrop.visible { display: flex; }
  #modal {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; width: 480px; max-width: 92vw; max-height: 80vh; overflow-y: auto;
  }
  #modal h3 { margin-bottom: 14px; font-size: 15px; }
  #modal .field { margin-bottom: 10px; }
  #modal .field label { display: block; color: var(--text-dim); font-size: 12px; margin-bottom: 3px; }
  #modal .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .mcp-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .mcp-item .name { font-family: monospace; font-weight: 600; }
  .mcp-item .detail { color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .warn-banner {
    background: #f8514911; border: 1px solid var(--red); color: var(--red);
    border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 13px;
  }
</style>
</head>
<body>
<div id="sidebar">
  <header>
    <h1>DeepAgent Web</h1>
    <button class="small primary" id="btn-new">+ 新会话</button>
  </header>
  <div id="sessions"></div>
  <footer>
    <div class="row">
      <label>审批模式</label>
      <select id="approval-mode">
        <option value="off">off — 全自动，不审批</option>
        <option value="dangerous">dangerous — 审批 shell/写文件</option>
        <option value="dangerous+mcp">dangerous+mcp — 再加 MCP 工具</option>
        <option value="all">all — 所有工具都审批</option>
      </select>
    </div>
    <div class="row">
      <button style="width:100%" id="btn-mcp">MCP 服务器管理</button>
    </div>
  </footer>
</div>

<div id="main">
  <div id="topbar">
    <span class="title" id="session-title">—</span>
    <span class="cwd" id="session-cwd"></span>
    <span class="model" id="model-badge">…</span>
  </div>
  <div id="chat"><div id="chat-inner"></div></div>
  <div id="todos"></div>
  <div id="composer">
    <div id="composer-inner">
      <textarea id="input" placeholder="给 Agent 下达任务…  (Enter 发送，Shift+Enter 换行)"></textarea>
      <button class="primary" id="btn-send">发送</button>
      <button id="btn-stop" style="display:none" class="danger">停止</button>
    </div>
    <div id="status-line"></div>
  </div>
</div>

<div id="modal-backdrop"><div id="modal"></div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const chatEl = $("chat-inner");
const state = {
  sessions: [],
  current: null,       // session object
  streaming: false,
  liveAssistant: null, // DOM refs for the in-progress assistant turn
};

// ------------------------------------------------------------ utils
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
// minimal markdown: fenced code, inline code, bold, headers, lists, paragraphs
function renderMd(src) {
  const blocks = String(src).split(/```/);
  let html = "";
  for (let i = 0; i < blocks.length; i++) {
    if (i % 2 === 1) {
      const nl = blocks[i].indexOf("\n");
      const code = nl >= 0 ? blocks[i].slice(nl + 1) : blocks[i];
      html += `<pre><code>${esc(code)}</code></pre>`;
    } else {
      let t = esc(blocks[i]);
      t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
      t = t.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/^### (.*)$/gm, "<strong>$1</strong>");
      t = t.replace(/^## (.*)$/gm, "<strong>$1</strong>");
      t = t.replace(/^# (.*)$/gm, "<strong>$1</strong>");
      t = t.replace(/^[-*] (.*)$/gm, "• $1");
      t = t.replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>");
      html += `<p>${t}</p>`;
    }
  }
  return html;
}
function scrollBottom() { $("chat").scrollTop = $("chat").scrollHeight; }
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// ------------------------------------------------------------ rendering
function addUserMsg(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  chatEl.appendChild(div);
  scrollBottom();
}
function newAssistantTurn() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  chatEl.appendChild(div);
  state.liveAssistant = { root: div, textEl: null, reasoningEl: null, text: "", reasoning: "" };
  return state.liveAssistant;
}
function liveTurn() { return state.liveAssistant ?? newAssistantTurn(); }
function appendAiText(text) {
  const turn = liveTurn();
  if (!turn.textEl || turn.textEl !== turn.root.lastElementChild) {
    // start a new text block (e.g. after a tool card)
    turn.textEl = document.createElement("div");
    turn.textEl.className = "content";
    turn.text = "";
    turn.root.appendChild(turn.textEl);
  }
  turn.text += text;
  turn.textEl.innerHTML = renderMd(turn.text);
  scrollBottom();
}
function appendReasoning(text) {
  const turn = liveTurn();
  if (!turn.reasoningEl) {
    turn.reasoningEl = document.createElement("div");
    turn.reasoningEl.className = "reasoning";
    turn.root.appendChild(turn.reasoningEl);
  }
  turn.reasoning += text;
  turn.reasoningEl.textContent = turn.reasoning;
  scrollBottom();
}
function addToolCard(call) {
  const turn = liveTurn();
  const card = document.createElement("div");
  card.className = "tool-card";
  card.dataset.callId = call.id ?? "";
  const argPreview = call.name === "execute"
    ? (call.args?.command ?? "")
    : JSON.stringify(call.args ?? {});
  card.innerHTML = `
    <div class="tool-head">
      <span class="tool-name">${esc(call.name)}</span>
      <span class="tool-arg">${esc(argPreview)}</span>
      <span class="tool-status"><span class="spinner"></span></span>
    </div>
    <div class="tool-body">
      <div class="label">参数</div><pre>${esc(JSON.stringify(call.args ?? {}, null, 2))}</pre>
      <div class="result-slot"></div>
    </div>`;
  card.querySelector(".tool-head").onclick = () => card.classList.toggle("open");
  turn.root.appendChild(card);
  turn.textEl = null; // next text starts a fresh block after the card
  scrollBottom();
  return card;
}
function setToolResult(id, name, text, status) {
  let card = chatEl.querySelector(`.tool-card[data-call-id="${CSS.escape(id ?? "")}"]`);
  if (!card) card = addToolCard({ id, name, args: {} });
  const ok = status !== "error";
  card.querySelector(".tool-status").innerHTML = ok ? "✓" : "✗";
  card.querySelector(".tool-status").style.color = ok ? "var(--green)" : "var(--red)";
  const slot = card.querySelector(".result-slot");
  slot.innerHTML = `<div class="label">结果</div><pre>${esc(text || "(空)")}</pre>`;
  scrollBottom();
}
function addWarnBanner(text) {
  const div = document.createElement("div");
  div.className = "warn-banner";
  div.textContent = text;
  chatEl.appendChild(div);
  scrollBottom();
}
function renderTodos(todos) {
  const el = $("todos");
  if (!todos || todos.length === 0) { el.classList.remove("visible"); return; }
  el.classList.add("visible");
  el.innerHTML = todos.map(t => {
    const icon = t.status === "completed" ? "☑" : t.status === "in_progress" ? "◉" : "☐";
    return `<div class="todo ${t.status}">${icon} ${esc(t.content)}</div>`;
  }).join("");
}

// ------------------------------------------------------------ approval UI
function showApproval(interrupts) {
  const actions = interrupts.flatMap(i => i.actionRequests);
  if (actions.length === 0) return;
  const div = document.createElement("div");
  div.className = "approval";
  div.innerHTML = `
    <h4>⚠ Agent 请求执行以下操作（${actions.length} 项）</h4>
    ${actions.map(a => `
      <div><strong style="font-family:monospace">${esc(a.name)}</strong></div>
      <pre>${esc(a.name === "execute" ? (a.args?.command ?? "") : JSON.stringify(a.args ?? {}, null, 2))}</pre>
    `).join("")}
    <div class="field" style="margin-top:8px">
      <input type="text" id="reject-reason" placeholder="拒绝理由（可选，拒绝时反馈给模型）">
    </div>
    <div class="buttons">
      <button class="primary" id="btn-approve">批准执行</button>
      <button class="danger" id="btn-reject">拒绝</button>
    </div>`;
  chatEl.appendChild(div);
  scrollBottom();
  const finish = () => div.remove();
  div.querySelector("#btn-approve").onclick = () => {
    finish();
    resumeRun(actions.map(() => ({ type: "approve" })));
  };
  div.querySelector("#btn-reject").onclick = () => {
    const reason = div.querySelector("#reject-reason").value.trim();
    finish();
    resumeRun(actions.map(() => ({ type: "reject", message: reason || "用户拒绝了该操作" })));
  };
}

// ------------------------------------------------------------ streaming
function setStreaming(on, statusText) {
  state.streaming = on;
  $("btn-send").style.display = on ? "none" : "";
  $("btn-stop").style.display = on ? "" : "none";
  $("status-line").innerHTML = on
    ? `<span class="spinner"></span> ${esc(statusText ?? "运行中…")}`
    : "";
}
async function consumeSSE(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
      const line = raw.split("\n").find(l => l.startsWith("data: "));
      if (!line) continue;
      handleEvent(JSON.parse(line.slice(6)));
    }
  }
}
function handleEvent(ev) {
  switch (ev.type) {
    case "ai_delta": appendAiText(ev.text); break;
    case "reasoning_delta": appendReasoning(ev.text); break;
    case "tool_calls":
      for (const c of ev.calls) {
        if (!chatEl.querySelector(`.tool-card[data-call-id="${CSS.escape(c.id ?? "")}"]`))
          addToolCard(c);
      }
      break;
    case "tool_result": setToolResult(ev.id, ev.name, ev.text, ev.status); break;
    case "todos": renderTodos(ev.todos); break;
    case "interrupt": showApproval(ev.interrupts); break;
    case "warning": addWarnBanner(ev.message); break;
    case "error": addWarnBanner("错误: " + ev.message); break;
    case "done": break;
  }
}
async function runStream(url, body, statusText) {
  setStreaming(true, statusText);
  state.liveAssistant = null;
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    await consumeSSE(res);
  } catch (e) {
    addWarnBanner("请求失败: " + e.message);
  } finally {
    setStreaming(false);
    loadSessions(); // refresh titles/order
  }
}
function sendMessage() {
  const text = $("input").value.trim();
  if (!text || state.streaming || !state.current) return;
  $("input").value = "";
  autoGrow();
  addUserMsg(text);
  runStream(`/api/sessions/${state.current.id}/messages`, { content: text });
}
function resumeRun(decisions) {
  runStream(`/api/sessions/${state.current.id}/resume`, { decisions }, "执行已审批的操作…");
}

// ------------------------------------------------------------ sessions
async function loadSessions() {
  const { sessions } = await api("/api/sessions");
  state.sessions = sessions;
  const el = $("sessions");
  el.innerHTML = "";
  for (const s of sessions) {
    const div = document.createElement("div");
    div.className = "session-item" + (state.current?.id === s.id ? " active" : "");
    div.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis">${esc(s.title)}</span>
      ${s.busy ? '<span class="spinner"></span>' : ''}<span class="del">✕</span>`;
    div.onclick = () => selectSession(s);
    div.querySelector(".del").onclick = async (e) => {
      e.stopPropagation();
      if (!confirm(`删除会话「${s.title}」？`)) return;
      await api(`/api/sessions/${s.id}`, { method: "DELETE" });
      if (state.current?.id === s.id) { state.current = null; chatEl.innerHTML = ""; }
      loadSessions();
    };
    el.appendChild(div);
  }
}
async function selectSession(s) {
  state.current = s;
  $("session-title").textContent = s.title;
  $("session-cwd").textContent = s.cwd;
  chatEl.innerHTML = "";
  renderTodos([]);
  loadSessions();
  try {
    const h = await api(`/api/sessions/${s.id}/history`);
    state.liveAssistant = null;
    for (const m of h.messages) {
      if (m.role === "user") addUserMsg(m.text);
      else if (m.role === "assistant") {
        const turn = newAssistantTurn();
        if (m.reasoning) appendReasoning(m.reasoning);
        if (m.text) appendAiText(m.text);
        for (const c of m.tool_calls) addToolCard(c);
        void turn;
      } else if (m.role === "tool") {
        setToolResult(m.tool_call_id, m.name, m.text, m.status);
      }
    }
    renderTodos(h.todos);
    if (h.interrupts?.length) showApproval(h.interrupts);
    state.liveAssistant = null;
    scrollBottom();
  } catch (e) {
    addWarnBanner("加载历史失败: " + e.message);
  }
}
async function createSession() {
  const cwd = prompt("工作目录（留空则自动创建独立目录）:", "");
  if (cwd === null) return;
  try {
    const { session } = await api("/api/sessions", { method: "POST", body: { cwd } });
    await loadSessions();
    selectSession(session);
  } catch (e) { alert(e.message); }
}

// ------------------------------------------------------------ MCP modal
async function showMcpModal() {
  const modal = $("modal");
  const { servers } = await api("/api/mcp");
  modal.innerHTML = `
    <h3>MCP 服务器</h3>
    <div id="mcp-list">${servers.length ? "" : '<div style="color:var(--text-dim);font-size:13px">尚未配置任何 MCP 服务器</div>'}</div>
    <hr style="border-color:var(--border);margin:14px 0">
    <h3>添加 / 更新</h3>
    <div class="field"><label>名称（字母数字-_）</label><input type="text" id="mcp-name"></div>
    <div class="field"><label>传输方式</label>
      <select id="mcp-transport"><option value="stdio">stdio（本地命令）</option><option value="http">http（Streamable HTTP / SSE）</option></select>
    </div>
    <div class="field" id="f-command"><label>命令 + 参数（如: npx -y @modelcontextprotocol/server-filesystem /tmp）</label><input type="text" id="mcp-command"></div>
    <div class="field" id="f-url" style="display:none"><label>URL</label><input type="text" id="mcp-url" placeholder="http://localhost:8000/mcp"></div>
    <div class="buttons">
      <button id="mcp-cancel">关闭</button>
      <button class="primary" id="mcp-save">保存</button>
    </div>`;
  const list = modal.querySelector("#mcp-list");
  for (const s of servers) {
    const item = document.createElement("div");
    item.className = "mcp-item";
    item.innerHTML = `<span class="name">${esc(s.name)}</span>
      <span class="detail">${esc(s.transport === "stdio" ? `${s.command} ${(s.args??[]).join(" ")}` : s.url)}</span>
      <button class="small danger">删除</button>`;
    item.querySelector("button").onclick = async () => {
      await api(`/api/mcp/${s.name}`, { method: "DELETE" });
      showMcpModal();
    };
    list.appendChild(item);
  }
  modal.querySelector("#mcp-transport").onchange = (e) => {
    modal.querySelector("#f-command").style.display = e.target.value === "stdio" ? "" : "none";
    modal.querySelector("#f-url").style.display = e.target.value === "http" ? "" : "none";
  };
  modal.querySelector("#mcp-cancel").onclick = () => $("modal-backdrop").classList.remove("visible");
  modal.querySelector("#mcp-save").onclick = async () => {
    const name = modal.querySelector("#mcp-name").value.trim();
    const transport = modal.querySelector("#mcp-transport").value;
    try {
      if (transport === "stdio") {
        const parts = modal.querySelector("#mcp-command").value.trim().split(/\s+/);
        await api("/api/mcp", { method: "POST", body: {
          name, transport, command: parts[0], args: parts.slice(1),
        }});
      } else {
        await api("/api/mcp", { method: "POST", body: {
          name, transport, url: modal.querySelector("#mcp-url").value.trim(),
        }});
      }
      showMcpModal();
    } catch (e) { alert(e.message); }
  };
  $("modal-backdrop").classList.add("visible");
}

// ------------------------------------------------------------ init
function autoGrow() {
  const el = $("input");
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 200) + "px";
}
$("input").addEventListener("input", autoGrow);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$("btn-send").onclick = sendMessage;
$("btn-stop").onclick = () => state.current && api(`/api/sessions/${state.current.id}/stop`, { method: "POST" });
$("btn-new").onclick = createSession;
$("btn-mcp").onclick = showMcpModal;
$("approval-mode").onchange = (e) =>
  api("/api/settings", { method: "POST", body: { approvalMode: e.target.value } });
$("modal-backdrop").onclick = (e) => {
  if (e.target === $("modal-backdrop")) $("modal-backdrop").classList.remove("visible");
};

(async function init() {
  try {
    const cfg = await api("/api/config");
    $("model-badge").textContent = cfg.model ?? "未配置模型";
    $("approval-mode").value = cfg.approvalMode;
    await loadSessions();
    if (state.sessions.length) selectSession(state.sessions[0]);
  } catch (e) {
    addWarnBanner("初始化失败: " + e.message);
  }
})();
</script>
</body>
</html>
