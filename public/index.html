<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepAgent Web</title>
<link rel="stylesheet" href="vendor/github-dark.min.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="assets/settings-app.css">
</head>
<body>
<div id="sidebar">
  <header>
    <h1>DeepAgent Web</h1>
    <button class="primary" id="btn-new">＋ 新建会话</button>
  </header>
  <div id="sessions"></div>
  <footer>
    <button id="btn-settings">⚙ 设置</button>
  </footer>
</div>

<div id="main">
  <div id="topbar">
    <span class="title" id="session-title">—</span>
    <span class="chip" id="cwd-chip"></span>
    <span class="chip" id="model-chip">…<div id="model-menu"></div></span>
    <span class="chip" id="skills-chip">⚡ 0 技能<div id="skills-tip"></div></span>
    <span class="chip" id="usage-chip" style="display:none" title="上下文 = 最近一次模型调用的输入+输出 tokens；累计 = 本会话所有调用的 tokens 总和"></span>
    <span class="chip" id="btn-export" style="display:none" title="导出会话为 Markdown">⬇ 导出</span>
    <span class="chip" id="files-chip" style="display:none" title="查看工作目录文件">🗂 文件</span>
  </div>
  <div id="chat"><div id="chat-inner"></div></div>
  <div id="todos"></div>
  <div id="composer">
    <div id="composer-inner">
      <button id="btn-jump-bottom" title="回到底部">↓</button>
      <textarea id="input" placeholder="给 Agent 下达任务…  (Enter 发送，Shift+Enter 换行)"></textarea>
      <button class="primary" id="btn-send">发送</button>
      <button id="btn-stop" style="display:none" class="danger">停止</button>
    </div>
    <div id="status-line"></div>
  </div>
</div>

<!-- 文件查看器：点击文件树中的文件后在此展示，带行号，Codex 风格侧边栏 -->
<div id="fileview">
  <div id="fileview-head">
    <span id="fileview-path" class="mono"></span>
    <span id="fileview-meta"></span>
    <button id="btn-fv-close" title="关闭">×</button>
  </div>
  <div id="fileview-body">
    <div class="fv-scroll">
      <div class="fv-ln"></div>
      <pre class="fv-code"><code></code></pre>
    </div>
  </div>
</div>

<!-- 文件树面板：会话 cwd 内的目录树 + 文本预览，手动刷新 -->
<div id="filepanel">
  <div id="filepanel-head">
    <span>文件</span>
    <span class="sp"></span>
    <button id="btn-tree-refresh" title="刷新">⟳</button>
    <button id="btn-tree-close" title="关闭">×</button>
  </div>
  <div id="filetree"></div>
</div>

<!-- 设置应用（Vue，构建产物在 assets/，源码在 frontend/）挂载点 -->
<div id="settings-root"></div>

<!-- new session modal -->
<div class="backdrop" id="new-session-backdrop">
  <div class="modal">
    <h3>选择工作目录</h3>
    <div id="recent-dirs"></div>
    <div class="field" style="margin-top:10px">
      <label>目录路径（留空则自动创建独立工作目录）</label>
      <div style="display:flex; gap:8px">
        <input type="text" id="new-cwd" class="mono" placeholder="~/my-project" style="flex:1">
        <button id="btn-browse-dir" title="浏览服务器上的目录">浏览…</button>
      </div>
    </div>
    <div id="dir-browser" style="display:none">
      <div id="dir-browser-head">
        <span id="dir-browser-path" class="mono" title=""></span>
        <button class="primary" id="btn-use-dir">选用此目录</button>
      </div>
      <div id="dir-browser-list"></div>
    </div>
    <div class="buttons">
      <button id="btn-ns-cancel">取消</button>
      <button class="primary" id="btn-ns-create">创建</button>
    </div>
  </div>
</div>

<!-- rename modal -->
<div class="backdrop" id="rename-backdrop">
  <div class="modal">
    <h3>重命名会话</h3>
    <div class="field"><input type="text" id="rename-input" maxlength="80"></div>
    <div class="buttons">
      <button id="btn-rn-cancel">取消</button>
      <button class="primary" id="btn-rn-ok">保存</button>
    </div>
  </div>
</div>

<!-- 第三方库（UMD，提供全局 marked / DOMPurify / hljs / Diff），本地 vendor 保证离线可用 -->
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/diff.min.js"></script>
<script type="module" src="js/main.js"></script>
<script type="module" src="assets/settings-app.js"></script>
</body>
</html>
