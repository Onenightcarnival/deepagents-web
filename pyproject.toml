[project]
name = "deepagent-web"
version = "0.2.0"
description = "Self-hosted web agent (Codex/Claude-Desktop style) built on deepagents + FastAPI + SQLite"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "deepagents>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-mcp-adapters>=0.1",
    "langchain-openai>=0.3",
    "langchain-deepseek>=0.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.uv]
package = false
