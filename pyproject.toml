[project]
name = "deepagent-web"
version = "0.2.0"
description = "Self-hosted web agent (Codex/Claude-Desktop style) built on deepagents + FastAPI + SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "deepagents>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-mcp-adapters>=0.1",
    "langchain-openai>=0.3",
    "langchain-deepseek>=0.1",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0",
    "mcp<2.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle 错误
    "W",       # pycodestyle 警告
    "F",       # pyflakes（未使用变量、未定义名称等）
    "I",       # isort 导入排序
    "UP",      # pyupgrade（使用 3.12 新语法）
    "B",       # bugbear（常见坑，如可变默认参数）
    "ASYNC",   # 异步代码检查（FastAPI/aiosqlite 场景）
    "FAST",    # FastAPI 专项检查
    "SIM",     # 化简建议，避免难维护的写法
    "RUF",     # ruff 自带规则
    "TID251",  # banned-api：禁止 sys.path 打补丁
    "TID252",  # 禁止相对导入
    "PLC0415", # 禁止内联 import（SDK 依赖隔离场景用 noqa 豁免）
    "PLW0602", # 禁止 global 声明
    "PLW0603", # 禁止 global 赋值
]
ignore = [
    "RUF001",  # 中文全角标点误报
    "RUF002",
    "RUF003",
    "FAST002", # 依赖注入统一用 db: Session = Depends(get_db) 传统写法，不强制 Annotated
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯用法：db: Session = Depends(get_db)
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.path".msg = "禁止对 sys.path 等路径打补丁；项目顶层入口为根目录，需要打补丁说明目录结构不正确"

[tool.ruff.lint.isort]
known-first-party = ["src"]
