# dev 环境配置（默认环境）。所有键都可省略，缺省值见 config_template.py。
# 其他环境：复制本文件为 prod.toml 等，用 --env prod 启动（不会被提交）。

[server]
host = "127.0.0.1"      # 局域网访问改为 "0.0.0.0"
port = 3080
context_root = "/deepagents-web"   # 应用上下文根：主页、静态资源、API 全部收在该前缀下（主页即 /api/）
                        # 后端返回 index.html 时注入给前端，改这里即可全局生效；healthz 固定在根路径
                        # 例外：Vite dev server（bun run dev）拿不到注入，其 proxy 按 /api 约定

[paths]
data_dir = "data"             # 相对项目根目录
workspace_root = "workspaces"

[agent]
shell_timeout = 300
model_max_retries = 2
