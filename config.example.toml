# 服务启动配置。复制为 config.toml 后按需修改；所有键都可省略（用默认值）。
# 模型服务商、MCP 服务器、技能目录在网页设置页配置，不在这里。

[server]
host = "127.0.0.1"      # 局域网访问改为 "0.0.0.0"，并务必设置 auth_token
port = 3080
# auth_token = "change-me"

[paths]
data_dir = "data"             # SQLite 数据目录（相对项目根目录）
workspace_root = "workspaces" # 自动创建的会话工作目录

[agent]
shell_timeout = 300     # execute 工具单条命令超时（秒）
model_max_retries = 2   # 模型请求失败重试次数
